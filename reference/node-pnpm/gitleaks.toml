# Argus — gitleaks configuration
#
# Extends the gitleaks default rule set with project-specific allowlists.
# See https://github.com/gitleaks/gitleaks#configuration for syntax.

title = "Argus gitleaks config"

# Inherit all default rules (AWS keys, GitHub tokens, private key headers,
# high-entropy strings, etc.) from the bundled config.
[extend]
useDefault = true

# ── Identity: absolute home-directory paths ─────────────────────────────────
# identity-protection.md invariant 3 forbids home-directory paths in file
# content. This rule belongs in the COMMITTED config — unlike the personal
# email/name patterns, it names nobody, so publishing it discloses nothing.
#
# Why it earns its place: Argus scrubbed its history of a personal email on
# 2026-07-04, then committed `/Users/<name>/argus` into a handover on
# 2026-07-23 and carried it for months. Three gitleaks layers were running
# and none of them held a pattern that could match, because the only rule
# that would have was in the per-machine local file — which was never
# created. A rule that needs a manual bootstrap step protects nothing until
# that step happens; this one ships with the repo.
#
# Agents write these constantly: a handover that says "cd /Users/x/proj
# first" is the natural way to record a shell gotcha.
#
# TWO LIMITS, both verified 2026-10-17 against gitleaks 8.30.1:
#
# 1. `--redact` hides only a rule's SECRET GROUP, and here that group is the
#    folder prefix — so a VERBOSE finding or a JSON report reads
#    `cd REDACTED<account>/project` and prints the very name this rule exists to
#    keep out. Nothing committed asks for either: the hooks print gitleaks'
#    summary only. Do not add `-v`, and do not keep a report of this rule's
#    findings.
#
# 2. Do NOT "fix" that by making the prefix group non-capturing. With the whole
#    match as the secret, and the default rules extended as below, every
#    `/home/<name>/` path stops being caught — 9 of 9 account names missed — while
#    `/Users/` paths still are. `secretGroup = 0` changes nothing. Detection is the
#    job; the redaction gap is a rule for whoever runs the scanner.
[[rules]]
id = "absolute-home-path"
description = "Absolute home-directory path — discloses the machine account name"
regex = '''(/Users/|/home/|C:\\Users\\)[A-Za-z0-9._-]{2,}[/\\]'''
tags = ["identity", "pii"]

# CI runners live under /home/runner (Linux) and /Users/runner (macOS);
# those paths are public knowledge and appear in pasted job logs.
#
# GOTCHA — `regexTarget = "match"` is load-bearing. A rule allowlist's
# default target is "secret", which for this rule is not the same span as
# the match, so without this line the allowlist silently does nothing and
# every CI path is a finding. Verified against gitleaks 8.30.1: plural
# `[[rules.allowlists]]` + regexTarget="match" suppresses runner paths and
# still catches real ones; the singular `[rules.allowlist]` form does not.
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(/home/runner[/\\]|/Users/runner[/\\])''']

# Repository-wide allowlist. The fixture directory contains deterministic
# obviously-fake secrets generated by @argus/testing's fakeSecret() helper.
# See docs/SECURITY-NOTES.md §"Test Fixtures with Secret-Like Content".
[[allowlists]]
description = "Synthetic fixtures for secret-detection rules"
paths = [
  '''tests/fixtures/secret-detection/.*''',
  '''.*/tests/fixtures/secret-detection/.*''',
]

# Allow gitleaks' own checksum/version files in CI logs to be ignored if they
# appear in diffs (unlikely but cheap to silence).
[[allowlists]]
description = "Lockfile noise (pnpm-lock entries with hash-like strings)"
paths = [
  '''pnpm-lock\.yaml''',
]

# Fake AWS-shaped strings used in this repo's own integration test for the
# pre-commit hook. These live in a single dedicated file inside the fixture
# tree above, but we name them explicitly so the test is robust to path
# renames.
[[allowlists]]
description = "Internal pre-commit-hook self-test placeholders"
regexes = [
  '''AKIA-FAKE-TEST-FIXTURE-[A-Z0-9]+''',
]
