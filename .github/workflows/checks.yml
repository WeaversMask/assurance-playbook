# The checks, on the two systems a reader is likely to have, plus the CI layer of the
# safety class (TRACKER.md, D-002 and D-005).
#
# RUNS SO FAR, 2026-10-17, on the private repository. First: ubuntu-latest and the history
# job green, macOS red — every check passed there and then the skip step failed the run,
# because eleven workflow cases needed PyYAML, which that runner's python3 lacks; they are
# dependency-free now. Second: all green, and the environment step showed the Ubuntu
# runner's awk is GNU Awk 5.2.1, NOT mawk, which is what a stock Debian or Ubuntu has — so
# the matrix gained a row that installs mawk, makes it `awk`, and fails if it is not.
# Third: green on every job, with no skipped case: ubuntu (dash, GNU awk, sed, grep),
# ubuntu with mawk 1.3.4, macOS arm64 (BSD awk, sed, grep), and the history check.
#
# SECURITY, in the order it matters: read-only token; no `pull_request_target`; every
# action pinned to a full commit SHA (the pins are the ones in
# reference/node-pnpm/ci/ci.yml); no secrets; nothing from the event is interpolated
# into a shell command. scripts/check-ci.test.sh fails if any of that is loosened.
#
# A SKIPPED CASE IS COVERAGE THAT DID NOT RUN. The suites skip their scan cases when
# gitleaks is missing, and say so; on a laptop that is a courtesy, here it would turn
# 20-odd cases into a green tick. The last step of the first job fails on any skip.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }}, ${{ matrix.awk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        awk: [default]
        include:
          # The Ubuntu runner image ships GNU awk as `awk`, so the default rows never meet
          # mawk. This row does, and the step below fails if it is not really mawk.
          - os: ubuntu-latest
            awk: mawk
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          sh scripts/install-gitleaks.sh
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Make mawk the awk (the default on stock Debian and Ubuntu)
        if: matrix.awk == 'mawk'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mawk
          sudo update-alternatives --set awk /usr/bin/mawk
          awk -W version 2>&1 | head -1
          if ! awk -W version 2>&1 | grep -q '^mawk'; then
            echo "::error title=awk is not mawk::the mawk row would test nothing"
            exit 1
          fi

      - name: Environment (for the record)
        run: |
          echo "runner:   $(uname -sm)"
          echo "sh:       $(ls -l /bin/sh | awk '{ print $NF }')"
          echo "awk:      $( (awk --version || awk -W version) 2>&1 | head -1 )"
          echo "sed:      $( (sed --version 2>/dev/null | head -1) | grep . || echo 'BSD sed (no --version)' )"
          echo "grep:     $(grep --version 2>&1 | head -1)"
          echo "git:      $(git --version)"
          echo "node:     $(node --version)"
          echo "python3:  $(python3 --version 2>&1)"
          echo "gitleaks: $(gitleaks version)"

      - name: Run every check
        run: |
          rc=0
          sh scripts/run-checks.sh > checks.log 2>&1 || rc=$?
          cat checks.log
          exit "$rc"

      - name: No case may have been skipped
        run: |
          if grep -q SKIPPED checks.log; then
            echo "::error title=Cases were skipped::a skipped case is coverage that did not run"
            grep SKIPPED checks.log
            exit 1
          fi

  # The CI layer of the safety class: the whole history of the pushed ref must have
  # been made as the declared identity and scan clean against the COMMITTED rules. It
  # cannot apply the maintainer's local patterns (they cannot live on a runner), so
  # the pre-push hook is where personal identifiers are caught. Not run on pull
  # requests: GitHub's synthetic merge commit is committed by "GitHub", which the
  # identity check would rightly refuse.
  history:
    name: history (identity and secrets)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          sh scripts/install-gitleaks.sh
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Check the whole history
        run: sh scripts/check-history.sh
